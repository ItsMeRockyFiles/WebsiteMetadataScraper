<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Metadata Scraper</title>
  <meta name="description" content="Extract title, description, Open Graph tags, Twitter Cards, favicons, JSON-LD structured data, and meta tags from any URL.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="container">
    <!-- Clean Minimal Header -->
    <header>
      <h1>Website Metadata Scraper</h1>
      <p class="subtitle">Extract Open Graph, Twitter Cards, JSON-LD, and meta tags from any URL.</p>
    </header>

    <!-- Main Scraper Tool -->
    <main class="app-container">
      <section class="card">
        <form id="scraperForm" class="search-form">
          <div class="input-group">
            <input 
              type="url" 
              id="urlInput" 
              class="url-input" 
              placeholder="https://github.com" 
              required
              autocomplete="off"
            />
            <button type="submit" id="submitBtn" class="btn-primary">
              <span id="btnText">Scrape URL</span>
              <span id="btnSpinner" class="loading-spinner" style="display: none;"></span>
            </button>
          </div>

          <div class="options-row">
            <div class="preset-buttons">
              <span class="preset-label">Try:</span>
              <button type="button" class="chip-btn" onclick="setSampleUrl('https://github.com')">GitHub</button>
              <button type="button" class="chip-btn" onclick="setSampleUrl('https://techcrunch.com')">TechCrunch</button>
              <button type="button" class="chip-btn" onclick="setSampleUrl('https://youtube.com')">YouTube</button>
              <button type="button" class="chip-btn" onclick="setSampleUrl('https://dev.to')">DEV.to</button>
            </div>

            <label class="toggle-group">
              <input type="checkbox" id="extendedToggle">
              <span>Include extended meta tags</span>
            </label>
          </div>
        </form>
      </section>

      <!-- Results View -->
      <section id="resultsSection" class="card" style="display: none;">
        <!-- Tabs Header -->
        <div class="tabs-header">
          <button type="button" class="tab-btn active" onclick="switchTab('preview')">Link Preview</button>
          <button type="button" class="tab-btn" onclick="switchTab('breakdown')">Summary</button>
          <button type="button" class="tab-btn" onclick="switchTab('json')">JSON Response</button>
          <button type="button" class="tab-btn" onclick="switchTab('code')">Code Snippets</button>
        </div>

        <!-- Tab 1: Visual Card Preview -->
        <div id="tab-preview" class="tab-content">
          <div class="preview-card">
            <div class="preview-image-container" id="previewImgContainer">
              <span class="preview-image-fallback">No Preview Image</span>
            </div>
            <div class="preview-content">
              <div class="preview-domain">
                <img id="previewFavicon" class="preview-favicon" src="" alt="favicon" style="display:none;" />
                <span id="previewDomainText">example.com</span>
              </div>
              <h3 id="previewTitle" class="preview-title">Page Title</h3>
              <p id="previewDesc" class="preview-desc">Page description metadata preview...</p>
            </div>
          </div>
        </div>

        <!-- Tab 2: Metadata Breakdown -->
        <div id="tab-breakdown" class="tab-content" style="display: none;">
          <div id="metaGrid" class="meta-grid">
            <!-- Dynamic elements populated by JS -->
          </div>
        </div>

        <!-- Tab 3: JSON Output -->
        <div id="tab-json" class="tab-content" style="display: none;">
          <div class="code-wrapper">
            <div class="code-header">
              <span>application/json</span>
              <button class="btn-copy" onclick="copyJson()">Copy JSON</button>
            </div>
            <pre><code id="jsonOutput">{}</code></pre>
          </div>
        </div>

        <!-- Tab 4: API Code Snippets -->
        <div id="tab-code" class="tab-content" style="display: none;">
          <div class="preset-buttons" style="margin-bottom: 1rem;">
            <button type="button" class="chip-btn" onclick="showSnippet('curl')">cURL</button>
            <button type="button" class="chip-btn" onclick="showSnippet('fetch')">JavaScript</button>
            <button type="button" class="chip-btn" onclick="showSnippet('axios')">Node.js</button>
            <button type="button" class="chip-btn" onclick="showSnippet('python')">Python</button>
          </div>
          <div class="code-wrapper">
            <div class="code-header">
              <span id="snippetLangLabel">cURL Request</span>
              <button class="btn-copy" onclick="copySnippet()">Copy Code</button>
            </div>
            <pre><code id="snippetOutput"></code></pre>
          </div>
        </div>
      </section>
    </main>

    <footer>
      Website Metadata Scraper API
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
